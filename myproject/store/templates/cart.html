{% extends 'base.html' %}
{% load static %}

{% block content %}

<h1>Shopping Cart</h1>

<div class="cart-summary">

    <h2>Cart Summary</h2>

    <ul>

        <li>
            <span>Full chicken</span>
            <span>$7.00</span>
        </li>

        <li>
            <span>Beef</span>
            <span>$4.00</span>
        </li>

        <li>
            <span>Vegetables</span>
            <span>$2.80</span>
        </li>

        <li>
            <span>Fish</span>
            <span>$3.00</span>
        </li>

    </ul>

    <div class="total">
        Total: $15.80
    </div>

</div>

<hr>

<h2>Checkout Form</h2>

<form method="post">

    {% csrf_token %}

    <div>

        <label for="name">Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email:</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="address">Delivery Address:</label>

        <textarea
            id="address"
            name="address"
            rows="4"
            placeholder="Enter your delivery address"
            required
        ></textarea>

    </div>

    <h2>Payment Method</h2>

    <p>Select your preferred payment method</p>

    <div>

        <!-- Cash on Delivery -->

        <label>

            <input
                type="radio"
                name="payment"
                value="cash"
                required
            >

            <div>

                <img
                    src="{% static 'images/image13.png' %}"
                    alt="Cash on delivery"
                >

                <h3>Cash on Delivery</h3>

                <p>
                    Pay when your order arrives at your door.
                </p>

                <span>Select</span>

            </div>

        </label>


        <!-- Credit/Debit Card -->

        <label>

            <input
                type="radio"
                name="payment"
                value="card"
            >

            <div>

                <img
                    src="{% static 'images/image11.png' %}"
                    alt="Credit card"
                >

                <h3>Credit/Debit Card</h3>

                <p>
                    Pay securely using your bank card.
                </p>

                <span>Select</span>

            </div>

        </label>


        <!-- PayPal -->

        <label>

            <input
                type="radio"
                name="payment"
                value="paypal"
            >

            <div>

                <img
                    src="{% static 'images/image12.png' %}"
                    alt="PayPal"
                >

                <h3>PayPal</h3>

                <p>
                    Pay securely using your PayPal account.
                </p>

                <span>Select</span>

            </div>

        </label>


        <!-- Ecocash -->

        <label>

            <input
                type="radio"
                name="payment"
                value="ecocash"
            >

            <div>

                <img
                    src="{% static 'images/image14.png' %}"
                    alt="Ecocash"
                >

                <h3>Ecocash</h3>

                <p>
                    Pay conveniently using Ecocash.
                </p>

                <span>Select</span>

            </div>

        </label>

    </div>

    <div>

        <button type="submit">
            Submit Order
        </button>

    </div>

</form>

{% endblock %}
