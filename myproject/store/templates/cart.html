{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart - Cart</title>


    <style>

        

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }


        

        .container {
            width: 70%;
            max-width: 1000px;
            margin: 40px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }


        h1 {
            color: #2E8B57;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        h2 {
            color: #2E8B57;
        }

        h3 {
            margin: 10px 0;
        }

        .section-title {
            text-align: center;
            margin-top: 30px;
        }


    

        .cart-summary {
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .cart-summary h2 {
            text-align: center;
            margin-top: 0;
        }

        .cart-summary ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .cart-summary li {
            display: flex;
            justify-content: space-between;
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        .cart-summary li:last-child {
            border-bottom: none;
        }



        .total {
            text-align: right;
            color: #2E8B57;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }


    

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 35px 0;
        }



        .customer-info {
            margin-top: 25px;
        }

        .customer-info label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #2E8B57;
        }

        textarea {
            resize: vertical;
        }




        .payment-instruction {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }


    

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }


        .payment-card {
            position: relative;
            display: block;
            border: 2px solid #ddd;
            border-radius: 12px;
            background-color: white;
            cursor: pointer;
            overflow: hidden;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }


        

        .payment-card input[type="radio"] {
            position: absolute;
            opacity: 0;
        }


        .card-content {
            text-align: center;
            padding: 25px 20px;
        }


    

        .payment-image {
            width: 100%;
            height: 100px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 10px;
        }


        .payment-image img {
            max-width: 150px;
            max-height: 90px;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        

        .payment-card h3 {
            color: #333;
            font-size: 19px;
            margin: 10px 0;
        }

        .payment-card p {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
            margin: 10px 0 15px;
        }


        

        .select-text {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 20px;

            background-color: #eee;

            color: #555;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;
        }


        

        .payment-card:hover {
            border-color: #2E8B57;

            transform: translateY(-4px);

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }




        .payment-card:has(input[type="radio"]:checked) {
            border-color: #2E8B57;

            background-color: #f0fff6;

            box-shadow:
                0 0 0 3px rgba(46, 139, 87, 0.15);
        }


        .payment-card:has(input[type="radio"]:checked)
        .select-text {

            background-color: #2E8B57;

            color: white;
        }




        .submit-section {
            text-align: center;
            margin-top: 35px;
        }

        button {
            background-color: #2E8B57;

            color: white;

            border: none;

            padding: 14px 35px;

            font-size: 17px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.3s;
        }

        button:hover {
            background-color: #1f6b43;

            transform: translateY(-2px);
        }



        nav {
            text-align: center;

            margin-top: 35px;

            padding-top: 20px;

            border-top: 1px solid #ddd;
        }


        nav a {
            display: inline-block;

            text-decoration: none;

            background-color: #2E8B57;

            color: white;

            padding: 10px 20px;

            margin: 5px;

            border-radius: 5px;

            font-weight: bold;

            transition: 0.3s;
        }


        nav a:hover {
            background-color: #1f6b43;
        }


        

        @media (max-width: 768px) {

            .container {
                width: 90%;
                padding: 25px;
                margin: 20px auto;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }
        }


        @media (max-width: 480px) {

            .container {
                width: 95%;
                padding: 18px;
            }

            .cart-summary li {
                font-size: 14px;
            }

            .total {
                font-size: 19px;
            }

            .payment-card h3 {
                font-size: 17px;
            }

            nav a {
                display: block;
                margin: 8px 0;
            }

            button {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="container">


    

    <h1>Shopping Cart</h1>


    

    <div class="cart-summary">

        <h2>Cart Summary</h2>

        <ul>

            <li>
                <span>Full chicken</span>
                <span>$7.00</span>
            </li>

            <li>
                <span>Beef</span>
                <span>$4.00</span>
            </li>

            <li>
                <span>Vegetables</span>
                <span>$2.80</span>
            </li>

            <li>
                <span>Fish</span>
                <span>$3.00</span>
            </li>

        </ul>

        <div class="total">
            Total: $15.80
        </div>

    </div>


    <hr>


    <h2 class="section-title">
        Checkout Form
    </h2>


    <form method="post">

        {% csrf_token %}


        <div class="customer-info">

            <label for="name">
                Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="address">
                Delivery Address:
            </label>

            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter your delivery address"
                required
            ></textarea>

        </div>


    

        <h2 class="section-title">
            Payment Method
        </h2>

        <p class="payment-instruction">
            Select your preferred payment method
        </p>


        <div class="payment-methods">


            <!-- CASH -->

            <label class="payment-card">

                <input
                    type="radio"
                    name="payment"
                    value="cash"
                    required
                >

                <div class="card-content">

                    <div class="payment-image">

                        <img src="images copy/image13.png" alt="cash on delivery">

                    </div>

                    <h3>
                        Cash on Delivery
                    </h3>

                    <p>
                        Pay when your order arrives at your door.
                    </p>

                    <span class="select-text">
                        Select
                    </span>

                </div>

            </label>


            

            <label class="payment-card">

                <input
                    type="radio"
                    name="payment"
                    value="card"
                >

                <div class="card-content">

                    <div class="payment-image">

                        
                        <img src="images copy/image11.png" alt="credit card">

                    </div>

                    <h3>
                        Credit/Debit Card
                    </h3>

                    <p>
                        Pay securely using your bank card.
                    </p>

                    <span class="select-text">
                        Select
                    </span>

                </div>

            </label>


            

            <label class="payment-card">

                <input
                    type="radio"
                    name="payment"
                    value="paypal"
                >

                <div class="card-content">

                    <div class="payment-image">

                        <img src="images copy/image12.png" alt="PayPal">
                        

                    </div>

                    <h3>
                        PayPal
                    </h3>

                    <p>
                        Pay securely using your PayPal account.
                    </p>

                    <span class="select-text">
                        Select
                    </span>

                </div>

            </label>


            

            <label class="payment-card">

                <input
                    type="radio"
                    name="payment"
                    value="ecocash"
                >

                <div class="card-content">

                    <div class="payment-image">
                        <img src="images copy/image14.png" alt="ecocash">

                    
                        >

                    </div>

                    <h3>
                        Ecocash
                    </h3>

                    <p>
                        Pay conveniently using Ecocash.
                    </p>

                    <span class="select-text">
                        Select
                    </span>

                </div>

            </label>


        </div>


        <div class="submit-section">

            <button type="submit">
                Submit Order
            </button>

        </div>


    </form>


    

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/products/">
            Products
        </a>
          <a href="cart.html">Cart 🛒</a>

        

    </nav>


</div>


</body>

</html>
